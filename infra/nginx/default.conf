# default.conf kustom untuk image web (nginx:alpine).
#
# Menggantikan default.conf stok image. Alasan: export statis Next.js
# (output: export, tanpa trailingSlash) menghasilkan berkas datar
# X.html, sehingga URL bersih (/login, /core/main) menjawab 404 pada
# konfigurasi stok tanpa try_files (AD-188, DA-15-01). Berkas ini
# dibakar ke dalam image web lewat Dockerfile.web (DEP-13: tanpa volume
# host); perbaikan TIDAK hidup di Caddy (DEP-14 melarang rewrite di
# Caddy, DA-15-14).
#
# URUTAN try_files WAJIB: $uri.html SEBELUM $uri/ (DA-15-02). Lima rute
# berbenturan dengan direktori export (out/core/setting.html berdampingan
# dengan out/core/setting/, dan seterusnya), sehingga bentuk yang mencoba
# $uri/ lebih dulu akan menjawab 301 lalu 403. $uri.html lebih dulu
# melayani berkas .html untuk kelima rute itu.
#
# STATUS GERBANG: berkas ini disiapkan pada branch penahan (HOLD) dan
# belum dibuktikan oleh build image, nginx -t, atau gate ulang. Jangan
# klaim deep-link lulus sebelum bukti itu ada. Pendaratan bersama
# perbaikan not-found.tsx (DA-15-03, pekerja DL2) adalah paket yang
# dipersyaratkan DA-15-01/04; error_page di bawah hanya aman bersama
# try_files, dan tidak boleh mendarat sendirian.
#
# Yang dipertahankan dari default stok: listen 80 + [::]:80,
# server_name localhost, root /usr/share/nginx/html, index, dan
# penanganan 50x. Yang diubah: root/index naik ke tingkat server agar
# location internal 404 memakai root yang sama; try_files + error_page
# 404; strip trailing slash (DA-15-11); absolute_redirect off agar
# redirect di balik proksi TLS memakai Location relatif; guard eksplisit
# untuk prefiks telanjang /core dan /mobile (DA-15-12) agar keduanya
# berakhir 404 + 404.html dan tidak berputar dengan strip slash.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Redirect memakai Location relatif; Caddy + perimeter mengakhiri
    # TLS di depan nginx, sehingga Location absolut http:// dari nginx
    # akan menurunkan skema. Bentuk relatif aman untuk kedua skema.
    absolute_redirect off;

    # URL tak dikenal memakai halaman 404 Next (404.html dari
    # not-found.tsx), bukan halaman 404 bawaan nginx. Location internal
    # mencegah 404.html disajikan sebagai halaman 200 biasa lewat
    # permintaan langsung; error_page mempertahankan status 404 asli.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Prefiks telanjang tidak punya page.tsx (DA-15-12). Tanpa guard ini,
    # /core dan /mobile akan berputar antara redirect slash direktori
    # dan strip slash di bawah. Guard mengakhiri keduanya pada 404 +
    # 404.html lewat error_page. Redirect ke rute produk (/core/main,
    # /mobile/chat atau /mobile/record) adalah putusan pemilik produk
    # yang belum ada; guard ini tidak mengarang target itu.
    location = /core {
        return 404;
    }

    location = /mobile {
        return 404;
    }

    location / {
        # Kanonis: tanpa trailing slash, kecuali root. /login/ -> 301
        # /login; /core/setting/ -> 301 /core/setting (lalu try_files
        # melayani setting.html, bukan 403 direktori). Pola mensyaratkan
        # minimal satu karakter sebelum slash akhir, sehingga / tidak
        # kena. Query string dipertahankan nginx karena replacement
        # tidak memuat tanda tanya.
        rewrite ^/(.+)/$ /$1 permanent;

        # $uri.html SEBELUM $uri/ (DA-15-02, wajib). $uri melayani berkas
        # persis (aset, .html langsung, payload .txt); $uri/ melayani
        # index direktori (hanya / yang punya index.html); =404 memicu
        # error_page di atas dengan status 404 yang dipertahankan.
        # Bentuk ini sengaja memakai =404 + error_page, bukan /404.html
        # sebagai argumen terakhir try_files, agar status 404 tidak
        # berubah menjadi 200.
        try_files $uri.html $uri $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
