# PostgreSQL host-based authentication for the DEPLOY path only.
# Mounted read-only by infra/docker-compose.deploy.yml as
# /etc/postgresql/pg_hba.conf and selected with hba_file. This file
# REPLACES the entrypoint-generated pg_hba.conf entirely; the
# POSTGRES_HOST_AUTH_METHOD variable has no effect on this file.
#
# Rule: every connection authenticates with SCRAM-SHA-256. There is
# no trust line anywhere in this file, for local or host connections.
# Do not add a trust line for debugging: use PGPASSWORD with
# `docker compose exec postgres psql` instead.
#
# No replication line is present on purpose: replication connections
# are denied because no line matches them (fail closed). Adding
# replication needs its own line, its own role, and a recorded
# decision; never widen the `all all` lines below to cover it.
#
# The dev compose (infra/docker-compose.dev.yml) does NOT use this
# file; dev keeps the entrypoint-generated defaults. See
# infra/docs/runbook-deploy.md for the deploy/dev split rationale.
#
# TYPE  DATABASE  USER  ADDRESS  METHOD
local   all       all            scram-sha-256
host    all       all   all      scram-sha-256
