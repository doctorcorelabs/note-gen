#
# Web CI for the NoteGen web fork (Fase 1 framework; F1-55, AD-01, AD-18;
# design F10 section 6 and F12 section 6).
#
# Gates: typecheck, lint, registration-drift, unit, contract, build,
# e2e-smoke, secret-scan, forbidden-strings.
# Every job must be green before merge (F12 section 6.2). There is no
# emergency merge without a written reason in the PR.
#
# The e2e-smoke job runs the Playwright @smoke subset (M16). Expected
# state until waves 3/4 land the features: E2E-01 passes (boot guard
# fail-closed contract) and the 5 TODO flows fail explicitly with
# "fitur belum mendarat". That red state is honest, not a regression:
# the TODO failures name the missing feature. The job must never pass
# vacuously. The contract suite landed in M7 (Vitest project
# "contract").
#
# Toolchain pins live here because root package.json has no
# packageManager/engines fields yet (F1-54 tracks that separately):
# Node 24 and pnpm 9, matching the upstream plugin-contract workflow.
# Root and server/ have separate lockfiles (AD-06), so each job that
# needs dependencies installs both trees. Jobs run on isolated
# runners, so there is no shared install job; the pnpm cache keeps
# per-job installs fast.
#
# Root package.json now carries typecheck/test scripts (landed in M7/M16);
# this workflow still calls tsc directly for the typecheck job and the
# server scripts directly, and calls the root test scripts for the
# contract and adapter suites. Toolchain pins stay here (see above).
#
# The secret-scan job uses gitleaks when the runner provides it and
# the grep backstop in scripts/secret-scan.sh otherwise. The backstop
# carries one documented baseline exception for an upstream shared
# key; see the script header. The gitleaks path is untested locally
# (no gitleaks binary in the authoring environment) and may flag that
# same baseline key until the AD-15 removal lands.
#
# Not in this framework: Docker image publication (AD-18, deploy work),
# the conditional Rust job (F12 section 6.1 job 8), and the license
# inventory gate (Fase 2, F10 section 6.1). Each needs its own decision
# and must not be added silently.

name: Web CI

on:
  pull_request:
    branches: [web, dev]
  # Feature branches use the web-<topic> scheme (AD-24): git forbids
  # web/<topic> refs alongside the web trunk ref.
  push:
    branches: [web, dev, "web-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile
      - name: Typecheck web app
        run: pnpm exec tsc --noEmit
      - name: Typecheck server
        run: pnpm --dir server run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Server has no lint setup yet; this job covers the root tree only.
      - name: Lint web app
        run: pnpm lint

  registration-drift:
    name: Registration drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No dependency install: the gate and the generator use only the
      # Node standard library (design section 8.3). The gate fails hard
      # when the generator interface is absent (TODO-ANTARMUKA) and never
      # passes vacuously; see scripts/check-registration-drift.mjs.
      - name: Check generated registration files are fresh
        run: node scripts/check-registration-drift.mjs

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile
      # Legacy node:test specs (F12 section 1). Listed explicitly: a
      # missing file fails here instead of silently shrinking the suite.
      - name: Run legacy node:test specs
        run: node --test src/lib/vector-document-key.spec.mjs src/app/core/main/file/folder-item/paste-target.spec.mjs src/app/core/main/mark/mark-view-mode.spec.mjs
      # Unit suites (AD-36, finding T1). The node:test suites under
      # src/lib/platform and src/lib/web run through
      # scripts/run-adapter-tests.mjs, which bundles each file with
      # esbuild, runs it under node --test, and asserts a real
      # counted result per file; the Vitest-style suites run through
      # `vitest run --project unit`. `pnpm test:unit` runs both, so
      # a vacuous run on either side fails this step. The file lists
      # are explicit in the script: a missing file, an unlisted new
      # spec/test file, or a file with 0 counted tests fails it.
      - name: Run unit suites
        run: pnpm test:unit
      - name: Run server tests
        run: pnpm --dir server test

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fail explicitly when the contract suite is absent
        run: |
          if [ ! -d tests/contract ] || [ -z "$(find tests/contract \( -name '*.test.ts' -o -name '*.spec.ts' -o -name '*.contract.ts' \) | head -n 1)" ]; then
            echo "CONTRACT SUITE MISSING: tests/contract has no test files yet (design F12 section 3)." >&2
            echo "This job fails explicitly instead of passing with no suite. Land the contract suite, then re-run." >&2
            exit 1
          fi
      - name: Run contract suite
        run: pnpm test:contract

  build:
    name: Full build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile
      # Full build: both esbuild worker bundles plus next build, never
      # next build alone (F12 section 5.1). Static export per AD-04.
      - name: Build web app
        run: pnpm build
      - name: Verify web build artifacts
        run: |
          test -d out
          test -f out/index.html
          test -f public/plugin-runtime.js
          test -f public/markdown-lexer.js
      - name: Build server
        run: pnpm --dir server run build
      - name: Verify server build artifact
        run: test -f server/dist/server.js

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Fail explicitly when the e2e smoke suite is absent
        run: |
          if [ ! -d tests/e2e ] || [ -z "$(ls playwright.config.* 2>/dev/null | head -n 1)" ]; then
            echo "E2E SMOKE SUITE MISSING: tests/e2e and a Playwright config do not exist yet (design F12 section 5)." >&2
            echo "This job fails explicitly instead of passing with no suite. Land the 6 critical flows, then re-run." >&2
            exit 1
          fi
      - name: Build then run e2e smoke subset
        run: |
          pnpm build
          pnpm e2e:smoke

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks when present, grep backstop otherwise)
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --no-git --exit-code 1
          else
            bash scripts/secret-scan.sh
          fi

  forbidden-strings:
    name: Forbidden strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      # No dependency install: the gate is a fixed-string grep over
      # src/ (AD-14, AD-109, W4-SEC). It fails on any occurrence of
      # the two forbidden literals and exits 1 when src/ is missing,
      # so it never passes vacuously on a broken checkout. Until
      # Actions runs for this repository, the same command is
      # verified locally: bash scripts/check-forbidden-strings.sh
      - name: Check for forbidden terminal literals in src/
        run: bash scripts/check-forbidden-strings.sh
